
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoom Viewer</title>
    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #000;
        height: 100%;
        width: 100%;
      }
      #openseadragon {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <div id="openseadragon"></div>
    <script>
      OpenSeadragon({
        id: "openseadragon",
        prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
        tileSources: {
          type: 'image',
          url: 'https://drive.google.com/uc?export=download&id=1aWABolw62u4Tw4Y8C-HIicN7WLext1E3'
        }
      });
    </script>
  </body>
</html>
