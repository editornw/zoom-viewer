
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Autumn Zoom Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        width: 100%;
        height: 100%;
      }
      #openseadragon {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="openseadragon"></div>
    <script>
      OpenSeadragon({
        id: "openseadragon",
        prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
        tileSources: "autumn_dzi.dzi"
      });
    </script>
  </body>
</html>
